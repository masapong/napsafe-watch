name: NapsafeWatch
options:
  bundleIdPrefix: com.napsafe
  deploymentTarget:
    watchOS: 10.0
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  NapsafeWatch:
    type: application
    platform: watchOS
    sources:
      - Sources
      - Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.napsafe.NapsafeWatch
      INFOPLIST_FILE: Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: Resources/NapsafeWatch.entitlements
      SUPPORTED_PLATFORMS: "watchos watchsimulator"
      TARGETED_DEVICE_FAMILY: 4
      SKIP_INSTALL: NO
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 97R97H732K
      PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Orio
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: "Orio needs your location to alert you before reaching your destination."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Orio tracks your position during naps to notify you near your stop."
        UIBackgroundModes:
          - location
    entitlements:
      path: Resources/NapsafeWatch.entitlements
      properties:
        com.apple.developer.location.push: true
        com.apple.developer.maps: true
